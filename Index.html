<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSU Vet Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>LSU Vet Student Practice Chat</h1>
        </header>
        <main>
        <div id="infoBar" class="info-bar"><span id="scoreBoard">Score: 0/0</span> | <span id="timer">Time: --</span></div>
            <div class="chat-container">
                <div id="chatWindow" class="chat-window"></div>
                <form id="chatForm">
                    <textarea id="userInput" rows="4" placeholder="Enter your text here..." required></textarea>
                    <div class="button-row"><button type="submit">Submit</button> <button type="button" id="hintButton">Hint</button></div>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
